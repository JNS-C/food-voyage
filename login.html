<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>로그인 — food-voyage</title>
<meta name="description" content="계정을 만들면 항해일지가 남습니다.">
<meta name="robots" content="noindex">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600&display=swap">

<script src="https://cdn.tailwindcss.com"></script>
<script src="tw-config.js"></script>
<link rel="stylesheet" href="styles.css">
</head>

<!--
  ⚠️ 계약(ID)만 고정이고 클래스·감싸는 마크업은 자유롭게 재디자인한다.

  고정 ID   : auth-card · auth-form · auth-title · auth-email · auth-password
              auth-nickname · auth-submit · auth-error · auth-current
              auth-switch · auth-switch-hint · toast
  헤더 슬롯 : auth-link · auth-name · auth-signout  (js/auth.js가 세 페이지에서 쓴다)
  상태 블록 : state-nokey · state-sent (auth-sent-email · auth-resend)
  콤보박스  : region-input · region-panel · region-listbox · region-status
              #tpl-region-option 의 [data-field] 속성명

  배치 제약 : #region-panel 은 <body> 직속이다. 카드 안에 넣으면 위치 계산이
              어긋난다. search.html의 같은 제약과 이유가 같다.
              #region-status 는 aria-live 라 절대 hidden 이 되면 안 된다.

  회원가입 전용 블록에는 [data-signup-only] 를 붙이고 display 유틸리티를
  붙이지 않는다. js/login.js가 hidden 속성으로만 여닫는다.
-->
<body class="bg-cream font-sans text-body text-ink antialiased">

<!-- ── 상단 유리 바 ──────────────────────────────────────
     body 직속을 유지한다. 조상에 transform이 걸리면 iOS Safari에서
     backdrop-filter가 통째로 죽는다 (LIQUID-GLASS §11.7-1). -->
<header class="lg lg-bar fixed inset-x-0 top-0 z-40">
  <div class="lg-bar-inner mx-auto flex max-w-content items-center justify-between gap-4 px-6 sm:px-8 lg:px-10">
    <a href="index.html"
       class="lg-link inline-flex h-11 items-center font-wordmark text-card-title font-semibold lowercase">food-voyage</a>

    <!-- 같은 배경을 공유하는 그룹 안에서 텍스트와 아이콘을 섞지 않는다 (§8.2).
         세션 복원 전에는 셋 다 hidden이다 — 틀린 상태가 잠깐 보이는 게 빈칸보다 나쁘다. -->
    <nav aria-label="주요" class="flex items-center gap-1">
      <a href="search.html"
         class="lg-link inline-flex h-11 items-center px-4 text-nav">맛집 찾기</a>
      <a id="auth-link" href="login.html"
         class="lg-link inline-flex h-11 items-center px-4 text-nav" hidden>로그인</a>
      <span id="auth-name"
            class="hidden xs:inline-flex h-11 items-center px-2 text-nav" hidden></span>
      <button id="auth-signout" type="button"
              class="lg-link inline-flex h-11 items-center px-4 text-nav" hidden>로그아웃</button>
    </nav>
  </div>
</header>

<div class="lg-scroll-edge" aria-hidden="true"></div>


<main class="below-bar mx-auto max-w-content px-6 pb-24 sm:px-8 lg:px-10">

  <div class="mx-auto w-full max-w-[420px]">

    <h1 id="auth-title" class="text-hero-2 font-semibold sm:text-hero-3">로그인</h1>
    <p class="mt-4 text-caption text-ink-48">계정을 만들면 항해일지가 남습니다.</p>

    <!-- 이미 로그인한 사람에게도 폼을 보여준다. 발표에서 계정 A·B를 갈아타야 하는데
         로그인 페이지가 홈으로 튕겨내면 그 동선이 막힌다. 지금 누구인지만 알려준다. -->
    <p id="auth-current"
       class="mt-6 rounded-card border border-hairline bg-white px-5 py-4 text-caption text-ink-72" hidden></p>

    <div id="auth-card" data-mode="signin" class="mt-6">

      <!-- novalidate를 쓰지 않는다. required·type·minlength가 브라우저에서
           한국어로 먼저 걸러 주고, 그 뒤 남는 것만 Supabase가 판정한다. -->
      <form id="auth-form" class="flex flex-col gap-5">

        <div>
          <label for="auth-email" class="block text-caption text-ink-72">이메일</label>
          <input id="auth-email" name="email" type="email" required autocomplete="email"
                 placeholder="you@example.com"
                 class="mt-2 h-[52px] w-full rounded-full border border-hairline bg-white px-6 text-body text-ink placeholder:text-ink-48 focus:outline focus:outline-2 focus:outline-offset-2 focus:outline-accent-focus">
        </div>

        <div>
          <label for="auth-password" class="block text-caption text-ink-72">비밀번호</label>
          <!-- minlength는 Supabase의 최소 길이 설정과 같아야 한다
               (Authentication > Sign In / Providers > Email). 다르면 화면이 가르치는
               규칙과 서버가 거절하는 규칙이 어긋난다. 대시보드를 바꾸면 여기도 바꾼다. -->
          <input id="auth-password" name="password" type="password" required minlength="8"
                 autocomplete="current-password" placeholder="8자 이상"
                 class="mt-2 h-[52px] w-full rounded-full border border-hairline bg-white px-6 text-body text-ink placeholder:text-ink-48 focus:outline focus:outline-2 focus:outline-offset-2 focus:outline-accent-focus">
        </div>

        <!-- ── 회원가입 전용 ────────────────────────────
             display 유틸리티를 붙이지 않는다. hidden 속성 하나로만 여닫는다
             (styles.css의 [hidden]{display:none!important}). -->
        <div data-signup-only hidden>
          <label for="auth-nickname" class="block text-caption text-ink-72">닉네임</label>
          <input id="auth-nickname" name="nickname" type="text" maxlength="20"
                 autocomplete="nickname" placeholder="항해일지에 표시됩니다"
                 class="mt-2 h-[52px] w-full rounded-full border border-hairline bg-white px-6 text-body text-ink placeholder:text-ink-48 focus:outline focus:outline-2 focus:outline-offset-2 focus:outline-accent-focus">
        </div>

        <div data-signup-only hidden>
          <label for="region-input" class="block text-caption text-ink-72">생활권 <span class="text-ink-48">(선택)</span></label>
          <!-- 검색 페이지와 같은 콤보박스를 쓴다. ARIA 속성은 js/region-combobox.js가
               마운트하며 붙인다. 카카오가 없어도 평범한 텍스트 입력으로 남는다. -->
          <input id="region-input" name="home_area" type="text" autocomplete="off"
                 placeholder="예: 정발산역"
                 class="mt-2 h-[52px] w-full rounded-full border border-hairline bg-white px-6 text-body text-ink placeholder:text-ink-48 focus:outline focus:outline-2 focus:outline-offset-2 focus:outline-accent-focus">
          <p class="mt-2 text-fine text-ink-48">자주 다니는 동네입니다. 나중에 바꿀 수 있습니다.</p>
        </div>

        <p id="auth-error" role="alert" aria-live="assertive"
           class="text-caption text-accent" hidden></p>

        <!-- 이 화면의 유일한 주요 액션이므로 채움을 갖는다 (button-primary). -->
        <button id="auth-submit" type="submit"
                class="press mt-1 h-[52px] w-full rounded-full bg-accent px-[26px] text-btn text-white transition duration-200 disabled:opacity-60 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-focus">
          로그인
        </button>
      </form>

      <p class="mt-6 text-center text-caption text-ink-48">
        <span id="auth-switch-hint">아직 계정이 없나요?</span>
        <button id="auth-switch" type="button"
                class="ml-1 text-caption text-accent underline-offset-4 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-focus">회원가입</button>
      </p>
    </div>

    <!-- Confirm email이 켜져 있으면 가입 직후 세션 없이 이 상태로 온다.
         에러가 아니라 정상 경로다 — 사용자가 할 일이 남았다는 뜻이다. -->
    <div id="state-sent" class="mt-6 rounded-card border border-hairline bg-white px-6 py-14 text-center" hidden>
      <p class="text-card-title font-semibold">메일함을 확인해 주세요</p>
      <p class="mt-3 text-body text-ink-72">
        <span id="auth-sent-email" class="font-semibold text-ink"></span>로 인증 링크를 보냈습니다.
        링크를 누르면 가입이 끝납니다.
      </p>
      <p class="mt-3 text-caption text-ink-48">메일이 안 보이면 스팸함도 확인해 주세요.</p>
      <!-- 보조 동작이라 button-quiet다. 테두리를 넣지 않는다. -->
      <button id="auth-resend" type="button"
              class="press mt-6 inline-flex h-11 items-center rounded-full px-[26px] text-btn text-accent transition duration-200 disabled:opacity-60 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-focus">
        인증 메일 다시 보내기
      </button>
    </div>

    <!-- search.html의 #state-nokey와 같은 컴포넌트다. 원인을 화면에서 읽게 한다. -->
    <div id="state-nokey" class="mt-6 rounded-card border border-hairline bg-white px-6 py-14 text-center" hidden>
      <p class="text-card-title font-semibold">Supabase 설정이 필요합니다</p>
      <p class="mt-3 text-body text-ink-72">
        <code class="rounded bg-divider-soft px-1.5 py-0.5 text-caption">config.js</code>의
        <code class="rounded bg-divider-soft px-1.5 py-0.5 text-caption">SUPABASE_URL</code> ·
        <code class="rounded bg-divider-soft px-1.5 py-0.5 text-caption">SUPABASE_ANON_KEY</code>가
        비어 있습니다.
      </p>
    </div>

  </div>

</main>


<!-- ── 지역 제안 패널 ────────────────────────────────
     ⚠️ 반드시 <body> 직속이다. left/top/bottom/width/max-height는
     region-combobox.js가 계산해 넣고, 생김새는 styles.css의 #region-panel이 갖는다. -->
<div id="region-panel" class="region-panel" hidden>
  <ul id="region-listbox" role="listbox" aria-label="지역 제안" class="region-list"></ul>
  <p data-region-note class="region-note" hidden></p>
  <div class="region-foot">
    <button type="button" data-region-clear class="region-clear" hidden>최근 검색 전체 지우기</button>
  </div>
</div>

<!-- 패널 바깥이다. aria-live는 hidden이면 낭독되지 않으므로 패널과 생사를 같이하면 안 된다. -->
<p id="region-status" role="status" aria-live="polite" class="sr-only"></p>

<template id="tpl-region-option">
  <li role="option" class="region-option">
    <span data-field="label" class="region-option-label"></span>
    <span data-field="detail" class="region-option-detail"></span>
  </li>
</template>


<!-- 세 페이지가 같은 계약을 쓴다 — textContent + data-visible.
     transform은 styles.css가 X·Y를 통째로 소유한다. 여기에 -translate-x-1/2를 두면
     #toast(1-0-0)가 유틸리티(0-1-0)를 이겨 가로 중앙 정렬이 조용히 깨진다.
     하단에 툴바가 없는 페이지라 .toast-above-toolbar가 아니라 bottom-8을 쓴다. -->
<div id="toast" role="status" aria-live="polite" data-visible="false"
     class="pointer-events-none fixed bottom-8 left-1/2 z-50 max-w-[calc(100vw_-_32px)] rounded-md bg-deep px-5 py-[14px] text-caption text-on-dark"></div>


<!-- config.js는 커밋 대상이라 정상적으로는 늘 있다. onerror는 배포에서 이 파일만
     빠지는 사고를 대비한 그물이다 — 404가 나도 JS 예외 대신 state-nokey를 띄운다. -->
<script src="config.js" onerror="window.__configMissing = true"></script>
<!-- UMD 빌드다. 이 저장소에는 type="module"이 하나도 없고, 모듈 스크립트는 defer
     의미론이라 순서 의존 로딩과 섞이면 window.FvAuth가 없는 순간이 생긴다.
     버전은 고정한다 (PRD §8 지킬 것 5). 전역 이름은 window.supabase다. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"
        onerror="window.__supabaseSdkMissing = true"></script>
<script src="js/kakao-places.js"></script>
<script src="js/region-combobox.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
