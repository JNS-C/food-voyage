<!-- food-voyage 앱 아이콘 원본. 딥 네이비 타일 위 황동 밥그릇이 곧 선체다: 그릇 몸통을 가로지르는 네이비 물결은 붓 자국처럼 양끝이 가늘고
     가운데가 굵은 유선형이며, 그릇 위 왼쪽으로 치우친 크림색 돛 두 장 사이의 좁은 틈(16px)이 돛대를 암시하고, 돛과 그릇 사이 간격도 같은 16px이다. 밥그릇과 배의 중의(重義)를 한 실루엣에 담았다.
     물결 도형 좌표는 사인 중심선 + 정현 두께 포락선으로 계산한 값이다(진폭 14, 파장 200, 최대 두께 15, 골–마루–골 위상).
     모서리는 OS가 깎으므로 꽉 찬 정사각형으로 두고, 글리프는 중앙 80% 안전 영역 안에 있다(maskable 겸용). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="tile" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#182A45"/><stop offset="1" stop-color="#0D1826"/></radialGradient>
    <clipPath id="bowl"><path d="M112 300H400C400 372 352 420 298 426H214C162 420 112 372 112 300Z"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#tile)"/>
