<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>food-voyage — 내 동네를 한 곳씩 개척하고 기록하는 미식 항해일지</title>
<meta name="description" content="늘 가던 가게만 가는 게 답답할 때. 다녀온 곳을 항해일지처럼 남기고 아직 비어 있는 구역을 발견하세요.">

<!-- 서체는 Pretendard 하나다. CDN 경로에 버전 태그를 반드시 붙인다 (DESIGN.md 서체 로딩) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  /**
   * DESIGN.md의 토큰을 여기 한 번만 등록한다.
   * 마크업에는 인라인 hex를 쓰지 않는다 (DESIGN Iteration Guide 3).
   */
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          accent: '#B86B32',
          'accent-focus': '#C97B3E',
          'accent-on-dark': '#E0A85C',
          ink: '#1C1A17',
          'ink-72': '#4A453C',
          'ink-48': '#6B6459',
          'on-dark': '#F4EFE6',
          'on-dark-muted': '#B9B2A6',
          cream: '#F4EFE6',
          'cream-deep': '#EAE1D2',
          'cream-deeper': '#E3D8C6', // card-place-mock 색면 3단계
          deep: '#0F1B2D',
          'deep-2': '#121F33',
          'deep-3': '#0D1826',
          hairline: '#E0D8C9',
          'divider-soft': '#EFE8DB',
          'glyph-empty': '#C9BFAD',
        },
        fontFamily: {
          // 서체는 Pretendard 하나다. 마지막 sans-serif는 CDN이 죽었을 때만 쓰인다.
          // 기기마다 다른 서체가 나오지 않도록 Apple SD Gothic Neo·system-ui를 두지 않는다.
          sans: ['Pretendard Variable', 'Pretendard', 'sans-serif'],
        },
        fontSize: {
          // 명조 시절의 +1px 보정값을 그대로 유지한다 (57/41/21/25).
          // 크기 체계를 흔들 만한 시각적 이득이 없다.
          'hero-1': ['28px', { lineHeight: '1.25', letterSpacing: '-0.5px' }],
          'hero-2': ['34px', { lineHeight: '1.25', letterSpacing: '-0.5px' }],
          'hero-3': ['41px', { lineHeight: '1.25', letterSpacing: '-0.5px' }],
          'hero-4': ['48px', { lineHeight: '1.25', letterSpacing: '-0.5px' }],
          hero: ['57px', { lineHeight: '1.25', letterSpacing: '-0.5px' }],
          section: ['41px', { lineHeight: '1.3', letterSpacing: '-0.4px' }],
          'card-title': ['21px', { lineHeight: '1.4', letterSpacing: '-0.2px' }],
          quote: ['25px', { lineHeight: '1.7', letterSpacing: '-0.2px' }],
          'quote-mark': ['48px', { lineHeight: '1', letterSpacing: '0' }],
          lead: ['24px', { lineHeight: '1.5', letterSpacing: '-0.2px' }],
          body: ['17px', { lineHeight: '1.47', letterSpacing: '-0.2px' }],
          btn: ['17px', { lineHeight: '1', letterSpacing: '-0.2px' }],
          caption: ['14px', { lineHeight: '1.5', letterSpacing: '-0.1px' }],
          ratio: ['14px', { lineHeight: '1', letterSpacing: '0' }],
          nav: ['14px', { lineHeight: '1.29', letterSpacing: '-0.1px' }],
          fine: ['12px', { lineHeight: '1.4', letterSpacing: '-0.1px' }],
        },
        borderRadius: {
          // 라운드 문법을 섞지 않는다. 타일 0, 카드 18, 사진 12, 버튼·검색창 pill
          card: '18px',
          photo: '12px',
          md: '12px',
        },
        boxShadow: {
          // 그림자는 음식 사진에만. 8/18에 실사진이 들어올 때 쓴다
          photo: 'rgba(28, 26, 23, 0.18) 3px 5px 30px',
        },
        screens: {
          // 640·1024·1280은 Tailwind 기본 sm·lg·xl과 이미 일치한다
          xs: '420px',
        },
        maxWidth: {
          content: '1200px',
        },
      },
    },
  };
</script>

<style type="text/tailwindcss">
  /* 누름 상태는 전역적으로 scale(0.96).
     카드의 hover:-translate-y-0.5와 같은 transform 속성을 다투므로
     주입 순서에 의존하지 않도록 !important로 못박는다. */
  .press:active { transform: scale(0.96) !important; }

  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }

  /* 스크롤 등장·퇴장.
     .reveal은 JS가 붙인다 — 스크립트가 죽어도 내용이 사라지지 않게 하기 위해서다.
     양방향이다. 내려가면 나타나고 올라가면 다시 사라진다. */
  .reveal {
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 700ms ease-out, transform 700ms ease-out;
  }
  .reveal.is-visible {
    opacity: 1;
    transform: none;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
    /* 움직임을 줄이는 설정에서는 등장 연출 자체를 하지 않는다 */
    .reveal { opacity: 1; transform: none; }
  }
</style>
</head>

<body class="bg-cream font-sans text-body text-ink antialiased">

<!-- 글리프 정의: 문서에 한 번만 두고 <use>로 재사용한다 -->
<svg width="0" height="0" class="absolute" aria-hidden="true" focusable="false">
  <symbol id="icon-anchor" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="4.1" r="2.3"/>
    <path d="M12 6.4V21"/>
    <path d="M7.2 9.6h9.6"/>
    <path d="M4 13.4c0 4.3 3.6 7.6 8 7.6s8-3.3 8-7.6"/>
  </symbol>
  <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round">
    <circle cx="10.8" cy="10.8" r="6.8"/>
    <path d="M20 20l-4.4-4.4"/>
  </symbol>
</svg>


<!-- ① 히어로 — 비어 있다 -->
<section class="bg-deep text-on-dark">
  <div class="mx-auto flex min-h-[88vh] max-w-content flex-col justify-between p-10 xs:p-12 sm:p-16 lg:p-20">

    <p class="text-card-title font-semibold lowercase text-on-dark">food-voyage</p>

    <div class="pt-20">
      <h1 class="max-w-[16ch] text-hero-1 font-semibold xs:text-hero-2 sm:text-hero-3 lg:text-hero-4 xl:text-hero">
        늘 가던 곳 말고,<br>아직 안 가본 골목.
      </h1>

      <p class="mt-6 max-w-[34ch] text-lead text-on-dark-muted">
        내 동네를 한 곳씩 개척하고 기록하는 미식 항해일지.
      </p>

      <div class="mt-10 flex max-w-[580px] flex-col gap-3 sm:flex-row">
        <form id="search-form" class="relative flex-1">
          <label for="search-input" class="sr-only">동네 이름으로 찾기</label>
          <svg class="pointer-events-none absolute left-6 top-1/2 h-4 w-4 -translate-y-1/2 text-ink-48" aria-hidden="true">
            <use href="#icon-search"/>
          </svg>
          <input id="search-input" type="text" autocomplete="off" placeholder="정발산역"
                 class="h-[52px] w-full rounded-full border border-hairline bg-white pl-[46px] pr-6 text-body text-ink placeholder:text-ink-48 focus:outline focus:outline-2 focus:-outline-offset-2 focus:outline-accent-focus">
        </form>

        <button id="start-btn" type="button"
                class="press h-[52px] shrink-0 rounded-full bg-accent-on-dark px-[26px] text-btn text-deep transition duration-200 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-on-dark">
          항해 시작하기
        </button>
      </div>

      <p class="mt-4 text-caption text-on-dark-muted">가게명이 아니라 동네 이름으로 찾습니다.</p>
    </div>

  </div>
</section>


<!-- ② 인기 맛집 — 채운다 -->
<section class="bg-cream text-ink">
  <div class="mx-auto max-w-content p-10 xs:p-12 sm:p-16 lg:p-20">

    <h2 class="text-hero-2 font-semibold sm:text-section">이 동네 사람들이<br class="sm:hidden"> 다시 간 곳</h2>

    <!-- 낯선 기호는 첫 등장 섹션에서 한 번만 설명한다 -->
    <p class="mt-4 flex items-center gap-2 text-caption text-ink-48">
      <svg class="h-4 w-4 text-accent" aria-hidden="true"><use href="#icon-anchor"/></svg>
      다시 찾은 사람의 비율
    </p>

    <div id="restaurant-grid" class="mt-8 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>

  </div>
</section>


<!-- ③ 최근 항해일지 — 쌓인다 -->
<section class="bg-deep text-on-dark">
  <div class="mx-auto max-w-content p-10 xs:p-12 sm:p-16 lg:p-20">

    <h2 class="text-hero-2 font-semibold sm:text-section">최근 항해일지</h2>
    <p class="mt-4 text-caption text-on-dark-muted">다른 사람이 남긴 기록입니다.</p>

    <!-- 스크롤러를 타일 밖으로 흘리지 않는다. 컨테이너 안에 두어야 위 섹션의
         카드 그리드와 좌측 시작선이 정확히 맞고, 카드가 잘려 보이지 않는다. -->
    <div id="log-scroller"
         class="no-scrollbar mt-8 flex snap-x snap-mandatory gap-6 overflow-x-auto"></div>

  </div>
</section>


<!-- ④ 서비스 특징 — 더 온다 -->
<section class="bg-white text-ink">
  <div class="mx-auto max-w-content p-10 xs:p-12 sm:p-16 lg:p-20">

    <h2 class="text-hero-2 font-semibold sm:text-section">곧 열립니다</h2>
    <p class="mt-4 text-caption text-ink-48">기록이 쌓이면 이런 것들이 따라옵니다.</p>

    <div id="feature-grid" class="mt-8 grid grid-cols-1 gap-6 sm:grid-cols-3"></div>

  </div>
</section>


<!-- ⑤ 푸터 -->
<footer class="bg-cream-deep text-ink-72">
  <div class="mx-auto max-w-content px-10 py-16 xs:px-12 sm:px-16 lg:px-20">

    <p class="text-card-title font-semibold lowercase text-ink">food-voyage</p>

    <div class="mt-6 leading-[2.2]">
      <p>만든 사람 · 최준서</p>
      <p>
        <a href="https://github.com/JNS-C/food-voyage" target="_blank" rel="noopener"
           class="text-accent underline-offset-4 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-focus">
          GitHub
        </a>
      </p>
      <!-- TODO: 프로젝트 허브 URL이 확정되면 위와 같은 <a>로 교체한다 -->
      <p class="text-ink-48">프로젝트 허브 (연결 예정)</p>
    </div>

    <p class="mt-8 text-fine text-ink-48">
      © 2026 food-voyage. 표시된 가게와 기록은 모두 가상의 예시입니다.
    </p>

  </div>
</footer>


<!-- 미구현 기능 안내 -->
<div id="toast" role="status" aria-live="polite"
     class="pointer-events-none fixed bottom-8 left-1/2 z-50 max-w-[calc(100vw_-_32px)] -translate-x-1/2 translate-y-3 rounded-md bg-deep px-5 py-[14px] text-caption text-on-dark opacity-0 transition duration-300"></div>

<script src="mock-data.js"></script>
<script src="script.js"></script>
</body>
</html>
